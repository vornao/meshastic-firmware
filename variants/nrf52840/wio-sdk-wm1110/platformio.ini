; The black Wio-WM1110 Dev Kit with sensors and the WM1110 module
[env:wio-sdk-wm1110]
extends = nrf52840_base
board = wio-sdk-wm1110

extra_scripts =
  ${env.extra_scripts}
  extra_scripts/disable_adafruit_usb.py

# Remove adafruit USB serial from the build (it is incompatible with using the ch340 serial chip on this board)
build_unflags = ${nrf52840_base:build_unflags} -DUSBCON -DUSE_TINYUSB
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/wio-sdk-wm1110
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DWIO_WM1110
  -DCFG_TUD_CDC=0
  -DMESHTASTIC_EXCLUDE_STORE_FORWARD=1 # Exclude store and forward to save space
  -DMESHTASTIC_EXCLUDE_TUNNELING=1    # Exclude tunneling to save space
  -DMESHTASTIC_EXCLUDE_MQTT=1        # Exclude MQTT to save space
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DRADIOLIB_EXCLUDE_SX126X=1            ; Exclude SX126x driver, which is not used on this board
  -DRADIOLIB_EXCLUDE_SX127X=1            ; Exclude SX127x driver, same reason
  -DRADIOLIB_EXCLUDE_SX128X=1            ; Exclude SX128x driver, same reason
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1   ; Exclude canned messages to save space
  -DMESHTASTIC_EXCLUDE_GPS=1              ; Exclude GPS to save
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1


board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/wio-sdk-wm1110>

;debug_tool = jlink
debug_tool = stlink
; No need to reflash if the binary hasn't changed

; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
;upload_protocol = nrfutil
;upload_protocol = stlink